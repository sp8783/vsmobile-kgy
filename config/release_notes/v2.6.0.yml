title: "🚀 v2.6.0 アップデートのお知らせ"
body: |
  今回は、各自がスマホのブラウザで公式の VS.モバイル（web.vsmobile.jp）を開き、そこから試合データをこのアプリ（VS.モバイル for KGY）に送れるようにする「VS.モバイル連携」です。昨今のセキュリティの問題を考え、ログイン状態（Cookie）を Web 上で共有・管理することは一時的であっても避けたいため、事前の Cookie の共有に代わる方法として用意しました。

  ## 📲 VS.モバイル連携
  - 対戦会のあと、**スマホのブラウザで公式の VS.モバイルを開き、自分の試合の統計をこのアプリに送れる**ようになりました
    - 操作するのはこのアプリではなく、公式の VS.モバイルを開いたブラウザ（Safari や Chrome など）です。VS.モバイルの公式アプリからは使えません
    - あらかじめブラウザのブックマーク（お気に入り）に専用の URL を登録しておき、公式の VS.モバイルを開いた状態でそのブックマークを開くと、その日の自分の試合がこのアプリに送られます
    - 送られるのは対戦結果のページの内容だけで、Cookie やパスワードは送られません
  - 準備は初回だけです。このアプリの「設定」→「VS.モバイル連携」で専用の URL を作り、[使い方のページ](https://vsm-kgy.com/vsmobile/guide)の手順でブラウザのブックマークに登録してください
  - **11/7 の対戦会からはこの方法でお願いします。** 事前の Cookie の共有は不要です
  - まだ送られていない自分の試合があるときは、このアプリのイベントの画面とダッシュボードにお願いのカードが出ます

  ## 🔧 そのほか
  - 未読のお知らせが複数あるとき、画面を移るたびに 1 件ずつ出ていたのを、まとめて 1 回出すようにしました。「閉じる」で全部既読になります
discord: |
  @everyone

  # :sparkles: **VS.モバイル for KGY v2.6.0 リリース！**

  v2.6.0をリリースしました :tada:
  今回は、各自がスマホのブラウザで公式の VS.モバイル（web.vsmobile.jp）を開き、そこから試合データをこのアプリ（VS.モバイル for KGY）に送れるようにする「VS.モバイル連携」です！
  昨今のセキュリティの問題を考え、ログイン状態（Cookie）を Web 上で共有・管理することは一時的であっても避けたいため、事前の Cookie の共有に代わる方法として用意しました。

  :link: **アプリURL**
  https://vsm-kgy.com/

  ──────────────────────────────

  ## :mobile_phone: **VS.モバイル連携**
  * 対戦会のあと、**スマホのブラウザで公式の VS.モバイルを開き、自分の試合の統計をこのアプリに送れる**ようになりました
    * 操作するのはこのアプリではなく、公式の VS.モバイルを開いたブラウザ（Safari や Chrome など）です。VS.モバイルの公式アプリからは使えません
    * あらかじめブラウザのブックマーク（お気に入り）に専用の URL を登録しておき、公式の VS.モバイルを開いた状態でそのブックマークを開くと、その日の自分の試合がこのアプリに送られます
    * 送られるのは対戦結果のページの内容だけで、Cookie やパスワードは送られません
  * 準備は初回だけです。このアプリの「設定」→「VS.モバイル連携」で専用の URL を作り、使い方のページの手順でブラウザのブックマークに登録してください
    * 使い方 → https://vsm-kgy.com/vsmobile/guide
  * **11/7 の対戦会からはこの方法でお願いします。** 事前の Cookie の共有は不要です
  * まだ送られていない自分の試合があるときは、このアプリのイベントの画面とダッシュボードにお願いのカードが出ます

  ## :wrench: **そのほか**
  * 未読のお知らせが複数あるとき、画面を移るたびに 1 件ずつ出ていたのを、まとめて 1 回出すようにしました。「閉じる」で全部既読になります

  ──────────────────────────────

  **バグの報告**や**機能要望**は引き続き <#1462281876524896458> へお願いします :person_bowing:
