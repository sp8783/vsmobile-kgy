title: "🚀 v2.4.1 アップデートのお知らせ"
body: |
  今回はスマホの操作の直しと、細かな修正です。

  ## 📱 スマホの操作
  - 入力欄（対戦記録の機体の選択、ログインのフォームなど）をタップしたときに、画面が自動で拡大されなくなりました

  ## 🔧 その他
  - リリース告知の末尾の「#バグ報告・要望」が、チャンネルへのリンクになるようにしました
discord: |
  @everyone

  # :sparkles: **VS.モバイル for KGY v2.4.1 リリース！**

  v2.4.1をリリースしました :tada:
  今回はスマホの操作の直しと、細かな修正です！

  :link: **アプリURL**
  https://vsm-kgy.com/

  ──────────────────────────────

  ## :iphone: **スマホの操作**
  * 入力欄（対戦記録の機体の選択、ログインのフォームなど）をタップしたときに、画面が自動で拡大されなくなりました

  ## :wrench: **その他**
  * リリース告知の末尾の「#バグ報告・要望」が、チャンネルへのリンクになるようにしました

  ──────────────────────────────

  **バグの報告**や**機能要望**は引き続き <#1462281876524896458> へお願いします :person_bowing:
