title: "🚀 v2.4.0 アップデートのお知らせ"
body: |
  今回は対戦結果の入力・スマホの操作の改善、配信アーカイブのタイムスタンプの自動登録、Discord のお知らせの改善、機体データの更新です。

  ## 📝 対戦結果の入力
  - 機体のプルダウンの先頭に「**最近使った機体**」を出すようにしました（お気に入り以外で最近使った機体が、新しい順に最大10機体並びます）
  - お気に入り機体は、これまでどおり画像からワンタップで選べます

  ## 📱 スマホの操作
  - 一番上から下に引いてもトップバーが動かなくなりました。そのまま引いて離すと、ページを読み直します（引っ張って更新）

  ## 🎬 配信アーカイブのタイムスタンプ
  - 対戦会のあとに各試合の統計を取り込むと、**配信アーカイブのタイムスタンプも自動で登録**されるようになりました
    - これまでは配信の動画を解析して付けていたので数時間かかっていましたが、対戦会の当日中に各試合から配信のその場面に飛べるようになります
    - 動画の解析は確認用に残し、ずれがあれば管理者が直します
  - 各試合の統計・配信アーカイブのタイムスタンプが登録されたら、イベントのフォーラム記事に**自動でお知らせ**します

  ## 🔔 Discord のお知らせ
  - イベント前日の「**事前準備のお願い**」を、イベントのフォーラム記事に投稿するようにしました
  - アプリのアップデートのお知らせを、アプリ内と Discord に自動で出すようにしました

  ## 🔧 機体データの更新
  - Wiki の最新の情報に合わせて、機体データを更新しました
    - `TX-ff104 アリュゼウス`（耐久値 650 → 600）
    - `ウイングガンダムフェニーチェ`（耐久値 660 → 640）
    - `ガンダム試作3号機`（耐久値 660 → 640）
    - `リグ・コンティオ`（BD回数 7 → 6、赤ロック距離 A → B）
    - `サイコ・ザク`（赤ロック距離 C → B）
    - `アッガイ(ダリル搭乗)`（赤ロック距離 通常時:Cレーダー通信時:S → 通常時:Bレーダー通信時:S）
  - 今後は Wiki の機体データを毎日確認するので、新機体や調整の反映が早くなります
discord: |
