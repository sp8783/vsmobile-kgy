title: "🚀 v2.5.0 アップデートのお知らせ"
body: |
  今回はセキュリティの強化と、内部の更新です。見た目や使い方は変わりません。

  ## 🔒 セキュリティの強化
  - ログインの試行回数に制限を付けました。短時間に何度も失敗すると、しばらくログインできなくなります
  - ゲストでログインしたときに、統計ページで他のプレイヤーの名前や個人の戦績が見えないようにしました
  - そのほか、内部の守りを固める修正をいくつか入れました

  ## 🔧 内部の更新
  - アプリを動かしている Ruby を 4.0 系に更新しました
discord: |
  @everyone

  # :sparkles: **VS.モバイル for KGY v2.5.0 リリース！**

  v2.5.0をリリースしました :tada:
  今回はセキュリティの強化と、内部の更新です！見た目や使い方は変わりません。

  :link: **アプリURL**
  https://vsm-kgy.com/

  ──────────────────────────────

  ## :lock: **セキュリティの強化**
  * ログインの試行回数に制限を付けました。短時間に何度も失敗すると、しばらくログインできなくなります
  * ゲストでログインしたときに、統計ページで他のプレイヤーの名前や個人の戦績が見えないようにしました
  * そのほか、内部の守りを固める修正をいくつか入れました

  ## :wrench: **内部の更新**
  * アプリを動かしている Ruby を 4.0 系に更新しました

  ──────────────────────────────

  **バグの報告**や**機能要望**は引き続き <#1462281876524896458> へお願いします :person_bowing:
