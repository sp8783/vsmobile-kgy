name: Deploy

# main への push で CI が成功したら、Kamal で本番へデプロイする（手動実行も可能）
on:
  workflow_run:
    workflows: [ CI ]
    types: [ completed ]
    branches: [ main ]
  workflow_dispatch:

# デプロイは常に 1 つずつ実行し、実行中のものは中断しない
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    # Secrets は production Environment（main ブランチからのみ利用可）に置く
    environment: production
    timeout-minutes: 30

    env:
      KAMAL_REGISTRY_PASSWORD: ${{ secrets.KAMAL_REGISTRY_PASSWORD }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      VSMOBILE_API_TOKEN: ${{ secrets.VSMOBILE_API_TOKEN }}
      KAMAL_GITHUB_TOKEN: ${{ secrets.KAMAL_GITHUB_TOKEN }}

    steps:
      # 外部の Actions はコミット SHA で固定する
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Ruby
        uses: ruby/setup-ruby@26e5b7d197ebf60545ee9667bcbace0be11ccaec # v1.334.0
        with:
          bundler-cache: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Trust the server host key
        env:
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" >> ~/.ssh/known_hosts

      # .kamal/secrets は RAILS_MASTER_KEY を config/master.key から読む
      - name: Write Rails master key
        env:
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
        run: printf '%s' "$RAILS_MASTER_KEY" > config/master.key

      - name: Deploy with Kamal
        run: bin/kamal deploy

  # リリース PR（release/vX.Y.Z → main）のデプロイが成功したら、タグ・GitHub Release を作り、
  # そのリリースの Issue を閉じて GitHub Project を Done にする（lib/release_finalizer.rb。リリース PR 以外では何もしない）
  finalize:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write
      issues: write
      pull-requests: read

    env:
      GH_TOKEN: ${{ github.token }}
      # GitHub Project の更新は、機体データの更新確認と同じ Fine-grained PAT（Projects の書き込みがあるとき）
      PROJECT_TOKEN: ${{ secrets.MOBILE_SUITS_UPDATE_TOKEN }}
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0

      - name: Set up Ruby
        uses: ruby/setup-ruby@26e5b7d197ebf60545ee9667bcbace0be11ccaec # v1.334.0
        with:
          bundler-cache: true

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Tag, release and close issues
        run: bin/rails release:finalize
