name: atwiki reachability check (temporary)

# 一時的な確認用（#382）: GitHub Actions のサーバーから atwiki に届くかを見る。マージ前に消す
on:
  pull_request:
    paths:
      - .github/workflows/atwiki-reachability-check.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install curl_cffi
        run: pip install "curl_cffi>=0.7.0"

      # 機体一覧のページと画像を 1 回ずつ取る（スクレイパーと同じく Chrome として接続する）
      - name: Fetch atwiki pages
        run: |
          python - <<'PY'
          from curl_cffi import requests
          for url in ["https://w.atwiki.jp/exvs2infiniteboost/pages/123.html",
                      "https://img.atwiki.jp/exvs2infiniteboost/attach/331/446/ms.png"]:
              r = requests.get(url, impersonate="chrome", timeout=10)
              print(r.status_code, len(r.content), url)
              assert r.status_code == 200
          PY
